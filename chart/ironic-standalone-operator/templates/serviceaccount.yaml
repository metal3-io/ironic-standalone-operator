{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "irso.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "irso.labels" . | nindent 4 }}
  {{- include "irso.annotations" (dict "ctx" $ "extra" .Values.serviceAccount.annotations) }}
{{- end }}
